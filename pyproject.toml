[project]
name = "tts-mcp"
version = "0.1.0"
description = "CLI + MCP server for OmniVoice TTS — speak, clone, design voices from terminal or AI agents"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    "huggingface_hub>=0.30.0",
    "omnivoice>=0.1.5",
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.15.0"]
mp3 = ["pydub>=0.25.1"]
tn = ["omnivoice[tn]"]

[project.scripts]
tts = "tts_mcp.cli:main"
tts-desktop = "tts_mcp.desktop:main"

[project.urls]
Repository = "https://github.com/nus/tts-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
