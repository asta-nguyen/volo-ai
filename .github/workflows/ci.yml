name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python and desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: stable
          cache: true
          rust-src-dir: apps/desktop/src-tauri

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            pkg-config

      - name: Install Python test dependencies
        run: |
          # Model runtimes are lazy imports; unit tests only need these dependencies.
          python -m pip install --editable . --no-deps
          python -m pip install 'mcp==2.3.0' 'numpy>=1.24.0' 'soundfile>=0.12.0'

      - name: Run Python tests and compile check
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q src tests

      - name: Install desktop Node dependencies
        run: npm ci --prefix apps/desktop

      - name: Build desktop frontend
        run: npm --prefix apps/desktop run build

      - name: Check Tauri Rust dependencies
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
