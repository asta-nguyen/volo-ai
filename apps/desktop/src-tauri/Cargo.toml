[package]
name = "volo-ai-desktop"
version = "0.1.0"
description = "Volo AI local voice desktop application"
authors = ["tts-mcp"]
edition = "2021"

[lib]
name = "tts_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
